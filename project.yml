name: PhotoOrganizer
options:
  bundleIdPrefix: com.jaynoel
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  swift: "5"

targets:
  PhotoOrganizer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Utilities
      - path: Views
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynoel.PhotoOrganizer
        SWIFT_VERSION: 5
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: SupportingFiles/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 929Y5D97SU
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleName: PhotoOrganizer
        CFBundleDisplayName: Photo Organizer
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen:
          UIColorName: ""
        NSPhotoLibraryUsageDescription: "Photo Organizer analyzes your photos on-device to build smart albums and find faces."
        NSPhotoLibraryAddUsageDescription: "Used if you ever save edits back to your library."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
